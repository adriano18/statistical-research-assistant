name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install local OCR engine and ENG/LAV/RUS language data
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng tesseract-ocr-lav tesseract-ocr-rus
          tesseract --version
          tesseract --list-langs
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Unit tests (real local OCR required)
        env:
          MPLBACKEND: Agg
          SRA_REQUIRE_REAL_OCR: "1"
        run: python -m unittest discover -s tests -v
      - name: OCR self-test with the system engine
        env:
          MPLBACKEND: Agg
        run: python ocr_selftest.py ocr-selftest.json && cat ocr-selftest.json

  # Issue #23: the Windows bundle drops package test suites, build-only files
  # and the Pillow AVIF codec ([tool.flet.cleanup] in pyproject.toml). Remove
  # exactly the same files here and run everything again, so a passing suite
  # proves that no supported procedure needs them.
  pruned-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install local OCR engine and ENG/LAV/RUS language data
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng tesseract-ocr-lav tesseract-ocr-rus
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Analysis self-test before pruning (reference report hashes)
        env:
          MPLBACKEND: Agg
        run: python analysis_selftest.py before-prune.json
      - name: Remove what the Windows bundle removes
        run: python tools/prune_packages.py --list | tail -n 20
      - name: Unit tests on the pruned environment (real local OCR required)
        env:
          MPLBACKEND: Agg
          SRA_REQUIRE_REAL_OCR: "1"
        run: python -m unittest discover -s tests
      - name: Analysis self-test after pruning (same report hashes)
        env:
          MPLBACKEND: Agg
        run: |
          python analysis_selftest.py after-prune.json
          python analysis_selftest.py --compare before-prune.json after-prune.json

  windows-sqlite:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install survey and spreadsheet-import dependencies
        run: python -m pip install "pandas>=2.2,<4" "openpyxl>=3.1,<4"
      - name: Check SQLite file cleanup on Windows
        run: python -m unittest discover -s tests -p "test_survey_storage.py" -v
      - name: Check Excel and CSV questionnaire imports on Windows
        run: python -m unittest discover -s tests -p "test_data_import_variations.py" -v
      - name: Check local language preferences on Windows
        run: python -m unittest discover -s tests -p "test_app_preferences.py" -v


  windows-research-journey:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install full application dependencies
        run: python -m pip install -r requirements.txt
      - name: Test actual questionnaire to analysis to Word report path
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -p "test_research_journey.py" -v
      - name: Test successful/failed questionnaire imports
        run: python -m unittest discover -s tests -p "test_survey_dataset_navigation.py" -v
      - name: Test Flet respondent preview navigation and Russian labels
        run: python -m unittest discover -s tests -p "test_survey_preview_ui.py" -v
      - name: In-app update checks with Windows' own signature verification (#45)
        run: python -m unittest discover -s tests -p "test_updates.py" -v
      - name: Test scientific questionnaire versions and scoring approvals
        run: python -m unittest discover -s tests -p "test_scientific_survey_import.py" -v
      - name: Test scientific Word/PDF draft review on Windows
        run: python -m unittest discover -s tests -p "test_survey_document_import_ui.py" -v
      - name: Test local PDFium page rendering and OCR review logic
        run: python -m unittest discover -s tests -p "test_visual_survey_review.py" -v
      - name: Test visual Word/PDF Flet import, editing and scanned PDF recovery
        run: python -m unittest discover -s tests -p "test_visual_survey_import_ui.py" -v
      - name: Test spatial OCR models, matrix reconstruction and split-screen review UI
        run: |
          python -m unittest discover -s tests -p "test_ocr_layout.py" -v
          python -m unittest discover -s tests -p "test_matrix_reconstruction.py" -v
          python -m unittest discover -s tests -p "test_spatial_review_ui.py" -v
      - name: Test True/False answer formats and desktop launcher on Windows
        run: |
          python -m unittest discover -s tests -p "test_true_false_import.py" -v
          python -m unittest discover -s tests -p "test_shared_scales.py" -v
          python -m unittest discover -s tests -p "test_brief_cope_import.py" -v
          python -m unittest discover -s tests -p "test_app_startup.py" -v
      - name: Test Stage 33 workspace on Windows (classic parity, shell, journeys)
        env:
          MPLBACKEND: Agg
        run: |
          python -m unittest discover -s tests -p "test_analysis_runs.py" -v
          python -m unittest discover -s tests -p "test_workspace_*.py" -v
      - name: Test local research projects on Windows (locks, file moves, backups)
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -p "test_project_*.py" -v

  workspace-screenshots:
    # Stage 33: render every workspace screen in a real browser (Flet web +
    # Playwright Chromium) at 100/125/150 % scale, light/dark and EN/LV/RU;
    # fail on blank pages or Flutter error placeholders; keep the PNGs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt "flet-web==1.0.5"
          npm install -g playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Capture and check workspace screenshots
        env:
          MPLBACKEND: Agg
        run: python tools/workspace_screenshot_suite.py workspace-screenshots --wait 12000
      - name: Keep the researcher's place (scroll, focus, item 60 of 120, open sections)
        # Stage 34.5 (issue #30): drives the real page like a user through
        # Flutter's accessibility tree; fails if a click or keystroke rebuilds it.
        env:
          MPLBACKEND: Agg
        run: python tools/workspace_state_checks.py workspace-screenshots/state
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage33-workspace-screenshots
          path: workspace-screenshots/
          retention-days: 14
