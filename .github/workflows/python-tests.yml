name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v

  windows-sqlite:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install survey and spreadsheet-import dependencies
        run: python -m pip install "pandas>=2.2,<4" "openpyxl>=3.1,<4"
      - name: Check SQLite file cleanup on Windows
        run: python -m unittest discover -s tests -p "test_survey_storage.py" -v
      - name: Check Excel and CSV questionnaire imports on Windows
        run: python -m unittest discover -s tests -p "test_data_import_variations.py" -v
      - name: Check local language preferences on Windows
        run: python -m unittest discover -s tests -p "test_app_preferences.py" -v


  windows-research-journey:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install full application dependencies
        run: python -m pip install -r requirements.txt
      - name: Test actual questionnaire to analysis to Word report path
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -p "test_research_journey.py" -v
      - name: Test successful/failed questionnaire imports
        run: python -m unittest discover -s tests -p "test_survey_dataset_navigation.py" -v
      - name: Test Flet respondent preview navigation and Russian labels
        run: python -m unittest discover -s tests -p "test_survey_preview_ui.py" -v
      - name: Test scientific questionnaire versions and scoring approvals
        run: python -m unittest discover -s tests -p "test_scientific_survey_import.py" -v
      - name: Test scientific Word/PDF draft review on Windows
        run: python -m unittest discover -s tests -p "test_survey_document_import_ui.py" -v
