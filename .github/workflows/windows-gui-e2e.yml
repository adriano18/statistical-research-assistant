name: Windows packaged GUI journeys (UI Automation)

# Stage 34.5: build the distributable Windows application exactly as
# windows-package.yml does, then drive it like a researcher with real mouse
# clicks, key presses and the native Open/Save dialogs (Windows UI
# Automation through pywinauto). Exports are opened and checked; numbers
# are compared with the validated engine. Screenshots, recordings (GIF) and
# the UI Automation tree of any missing control are kept as an artifact.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.py"
      - "app_identity.py"
      - "app_paths.py"
      - "data_ui.py"
      - "legacy_data.py"
      - "research_app.py"
      - "workspace_*.py"
      - "project_*.py"
      - "import_session.py"
      - "import_review.py"
      - "scientific_survey_import.py"
      - "visual_survey_review.py"
      - "survey_*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "tools/windows_gui_e2e.py"
      - "tests/synthetic_documents.py"
      - "tests/stage36_fixtures.py"
      - "tests/fixtures/stage36/generate_fixtures.py"
      - ".github/workflows/windows-gui-e2e.yml"

permissions:
  contents: read

jobs:
  gui-journeys:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      RUNTIME_DIR: bundled_ocr\windows-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and the UI Automation driver
        run: python -m pip install -r requirements.txt "zstandard>=0.23,<1" "pywinauto==0.6.9"
      - name: Cache pinned OCR packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\ocr-cache
          key: ocr-msys2-${{ hashFiles('packaging/windows_ocr_runtime.lock.json') }}
      - name: Prepare pinned Tesseract runtime (SHA-256 verified)
        run: python tools/prepare_windows_ocr_runtime.py fetch --out "${{ env.RUNTIME_DIR }}" --cache "${{ runner.temp }}\ocr-cache"
      - name: Use a 1920x1080 desktop
        shell: pwsh
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          python -c "import ctypes; u=ctypes.windll.user32; print('screen', u.GetSystemMetrics(0), 'x', u.GetSystemMetrics(1))"
      - name: Version identity of this build
        run: python tools/write_build_info.py --channel preview --version "1.0.0-ci.${{ github.run_number }}" --build "${{ github.run_number }}" --commit "${{ github.sha }}"
      - name: Build the Windows application (as distributed)
        run: >-
          flet build windows .
          --module-name app
          --python-version 3.12
          --product "Statistical Research Assistant"
          --artifact "StatisticalResearchAssistant"
          --no-rich-output --yes
      - name: Locate the executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build/windows" -Filter "StatisticalResearchAssistant.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Expected .exe was not created" }
          "EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Researcher journeys on the packaged application
        shell: pwsh
        timeout-minutes: 45
        run: |
          python tools/windows_gui_e2e.py "$env:EXE_PATH" gui-e2e --probe
          if ($LASTEXITCODE -ne 0) { throw "Packaged GUI journeys failed (see gui-e2e/gui-e2e-result.json)" }
      - name: Upload screenshots, recordings and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-e2e
          path: gui-e2e/
          if-no-files-found: warn
          retention-days: 14
