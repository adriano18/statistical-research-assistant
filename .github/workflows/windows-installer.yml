name: Windows installer (install, upgrade, uninstall)

# Stage 35 (#44): build the application as distributed, package it with
# Inno Setup, then on this clean runner: install it per user without
# administrator rights, check the Start-menu shortcut and the "Installed
# apps" registration, copy a preview build's data on first start, run the
# researcher journeys on the INSTALLED program, upgrade it in place to a
# later version, and uninstall it silently. The research data folder must
# survive every step.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.py"
      - "window_guard.py"
      - "app_identity.py"
      - "app_paths.py"
      - "data_ui.py"
      - "legacy_data.py"
      - "project_store.py"
      - "startup_diagnostics.py"
      - "interface_layout.py"
      - "research_app.py"
      - "workspace_*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "packaging/**"
      - "tools/build_installer.py"
      - "tools/write_build_info.py"
      - "tools/check_installed_app.py"
      - "tools/windows_gui_e2e.py"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 170
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      RUNTIME_DIR: bundled_ocr\windows-x64
      VERSION_A: 1.0.0-preview.${{ github.run_number }}
      VERSION_B: 1.0.1-preview.${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and the UI Automation driver
        run: python -m pip install -r requirements.txt "zstandard>=0.23,<1" "pywinauto==0.6.9"
      - name: Cache pinned OCR packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\ocr-cache
          key: ocr-msys2-${{ hashFiles('packaging/windows_ocr_runtime.lock.json') }}
      - name: Prepare pinned Tesseract runtime (SHA-256 verified)
        run: python tools/prepare_windows_ocr_runtime.py fetch --out "${{ env.RUNTIME_DIR }}" --cache "${{ runner.temp }}\ocr-cache"
      - name: Use a 1920x1080 desktop
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Version identity of this build
        run: python tools/write_build_info.py --channel preview --version "${{ env.VERSION_A }}" --build "${{ github.run_number }}" --commit "${{ github.sha }}"
      - name: Build the Windows application
        run: >-
          flet build windows .
          --module-name app
          --python-version 3.12
          --product "Statistical Research Assistant"
          --artifact "StatisticalResearchAssistant"
          --build-version 1.0.0
          --build-number ${{ github.run_number }}
          --no-rich-output --yes
      - name: Check the bundle
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          $exe = Get-ChildItem -Path build/windows -Filter StatisticalResearchAssistant.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Expected .exe was not created" }
          $bundle = Split-Path $exe.FullName
          "BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Test-Path "$bundle\app\build_info.json")) { throw "build_info.json is not in the bundle" }
          Get-Content "$bundle\app\build_info.json"
          (Get-Item $exe.FullName).VersionInfo | Format-List CompanyName, ProductName, FileVersion, ProductVersion
          python tools/check_packaged_ocr.py build/windows
          if ($LASTEXITCODE -ne 0) { throw "packaged OCR check failed" }

      - name: Install Inno Setup when the runner has none
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $iscc -and -not (Get-Command ISCC -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup could not be installed" }
          }
      - name: Build the installer (unsigned preview)
        run: python tools/build_installer.py "${{ env.BUNDLE }}" --out dist
      - name: Build a later version for the upgrade test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          Copy-Item -Recurse -Path $env:BUNDLE -Destination build\windows-b
          python tools/write_build_info.py --channel preview --version "$env:VERSION_B" --build "${{ github.run_number }}" --commit "${{ github.sha }}" --out build\windows-b\app\build_info.json
          python tools/build_installer.py build\windows-b --out dist-b --compression lzma2/fast
          if ($LASTEXITCODE -ne 0) { throw "the second installer could not be built" }
      - name: Installer size
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          $meta = Get-Content dist\installer.json -Raw | ConvertFrom-Json
          $installed = (Get-ChildItem -Recurse -File $env:BUNDLE | Measure-Object -Sum Length).Sum
          $lines = @(
            "### Installer",
            "- File: ``$($meta.file)`` ($([math]::Round($meta.size / 1MB, 1)) MiB, $($meta.size) bytes, $($meta.compression))",
            "- SHA-256: ``$($meta.sha256)``",
            "- Installed program folder: $([math]::Round($installed / 1MB, 1)) MiB",
            "- Signed: $($meta.signed) (unsigned preview: Windows SmartScreen may warn)"
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $lines

      - name: Fresh per-user install (silent, no administrator rights)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          python tools/check_installed_app.py install "dist\StatisticalResearchAssistant-${{ env.VERSION_A }}-Setup.exe" --log installed\install-a.log
          python tools/check_installed_app.py verify --version "${{ env.VERSION_A }}" --json installed\verify-a.json
          python tools/check_installed_app.py snapshot installed\program-a.json
      - name: "Installed program, real data folder: a preview's data is copied; projects stay out of the program folder"
        shell: pwsh
        timeout-minutes: 25
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          python tools/windows_gui_e2e.py "$env:LOCALAPPDATA\Programs\Statistical Research Assistant\StatisticalResearchAssistant.exe" installed\real-data --real-data --only legacy-migration installed-data
          if ($LASTEXITCODE -ne 0) { throw "installed-application journeys failed" }
      - name: Researcher journeys on the installed program
        shell: pwsh
        timeout-minutes: 45
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          python tools/windows_gui_e2e.py "$env:LOCALAPPDATA\Programs\Statistical Research Assistant\StatisticalResearchAssistant.exe" installed\journeys
          if ($LASTEXITCODE -ne 0) { throw "journeys on the installed program failed" }
      - name: Normal start of the installed program (screenshots)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          python tools/check_gui_startup.py "$env:LOCALAPPDATA\Programs\Statistical Research Assistant\StatisticalResearchAssistant.exe" installed\startup
          if ($LASTEXITCODE -ne 0) { throw "startup check of the installed program failed" }
      - name: Running the program changed nothing in the program folder
        run: python tools/check_installed_app.py unchanged installed\program-a.json

      - name: Upgrade in place to the later version
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          python tools/check_installed_app.py install "dist-b\StatisticalResearchAssistant-${{ env.VERSION_B }}-Setup.exe" --log installed\install-b.log
          python tools/check_installed_app.py verify --version "${{ env.VERSION_B }}" --json installed\verify-b.json
          python tools/check_installed_app.py data installed\data-after-upgrade.json --expect "Installed study (fictional)" --expect "Preview-era study (fictional)"
      - name: The upgraded program opens the same projects
        shell: pwsh
        timeout-minutes: 15
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          python tools/windows_gui_e2e.py "$env:LOCALAPPDATA\Programs\Statistical Research Assistant\StatisticalResearchAssistant.exe" installed\after-upgrade --real-data --only installed-reopen
          if ($LASTEXITCODE -ne 0) { throw "the upgraded program did not reopen the projects" }

      - name: Silent uninstall keeps the research data
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          python tools/check_installed_app.py uninstall --log installed\uninstall.log
          python tools/check_installed_app.py removed --json installed\removed.json
          python tools/check_installed_app.py data installed\data-after-uninstall.json --expect "Installed study (fictional)" --expect "Preview-era study (fictional)"
      - name: A new installation finds the data again
        shell: pwsh
        timeout-minutes: 15
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          python tools/check_installed_app.py install "dist\StatisticalResearchAssistant-$env:VERSION_A-Setup.exe" --log installed\reinstall.log
          python tools/check_installed_app.py verify --version "$env:VERSION_A"
          python tools/windows_gui_e2e.py "$env:LOCALAPPDATA\Programs\Statistical Research Assistant\StatisticalResearchAssistant.exe" installed\reinstalled --real-data --only installed-reopen
          if ($LASTEXITCODE -ne 0) { throw "the reinstalled program did not find the projects" }
          python tools/check_installed_app.py uninstall --log installed\uninstall-2.log
          python tools/check_installed_app.py removed

      - name: Upload the installer (unsigned preview)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StatisticalResearchAssistant-Setup-unsigned-preview
          path: |
            dist/*.exe
            dist/*.sha256
            dist/installer.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload installation evidence (logs, screenshots, results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-evidence
          path: installed/
          if-no-files-found: warn
          retention-days: 14
