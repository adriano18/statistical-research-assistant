name: Windows desktop bundle (manual, unsigned preview)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install direct project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python code
        run: python -m compileall -q .
      - name: Validate local import and preference paths
        run: |
          python -m unittest discover -s tests -p "test_data_import_variations.py" -v
          python -m unittest discover -s tests -p "test_app_preferences.py" -v
      - name: Build unsigned Windows desktop bundle
        run: >-
          flet build windows .
          --module-name app
          --python-version 3.12
          --product "Statistical Research Assistant"
          --artifact "StatisticalResearchAssistant"
          --no-rich-output --yes
      - name: Validate executable exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build/windows" -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -eq "StatisticalResearchAssistant.exe" } |
            Select-Object -First 1
          if (-not $exe) { throw "Expected .exe was not created" }
          Write-Output "Found preview executable: $($exe.FullName)"
      - name: Upload unsigned portable preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: StatisticalResearchAssistant-Windows-unsigned-preview
          path: build/windows/
          if-no-files-found: error
          retention-days: 14
