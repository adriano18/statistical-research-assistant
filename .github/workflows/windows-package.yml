name: Windows desktop bundle with offline OCR (unsigned preview)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.py"
      - "research_app.py"
      - "startup_diagnostics.py"
      - "binary_responses.py"
      - "response_scales.py"
      - "shared_scales.py"
      - "pyproject.toml"
      - "ocr_*.py"
      - "visual_survey_review.py"
      - "matrix_reconstruction.py"
      - "scientific_survey_import.py"
      - "spatial_review_ui.py"
      - "survey_ui.py"
      - "interface_layout.py"
      - "analysis_runs.py"
      - "analysis_selftest.py"
      - "import_session.py"
      - "workspace_*.py"
      - "requirements.txt"
      - "packaging/**"
      - "tools/prepare_windows_ocr_runtime.py"
      - "tools/check_gui_startup.py"
      - "tools/package_audit.py"
      - "tools/prune_packages.py"
      - "tests/test_distribution_tools.py"
      - "tests/test_true_false_import.py"
      - "tests/test_shared_scales.py"
      - "tests/test_app_startup.py"
      - "tests/test_real_tesseract_ocr.py"
      - "tests/test_analysis_runs.py"
      - "tests/test_workspace_*.py"
      - "tests/workspace_harness.py"
      - ".github/workflows/windows-package.yml"

permissions:
  contents: read

jobs:
  windows-ocr-bundle:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      RUNTIME_DIR: bundled_ocr\windows-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install direct project dependencies
        run: python -m pip install -r requirements.txt "zstandard>=0.23,<1"
      - name: Cache pinned OCR packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\ocr-cache
          key: ocr-msys2-${{ hashFiles('packaging/windows_ocr_runtime.lock.json') }}
      - name: Prepare pinned Tesseract runtime (SHA-256 verified)
        run: python tools/prepare_windows_ocr_runtime.py fetch --out "${{ env.RUNTIME_DIR }}" --cache "${{ runner.temp }}\ocr-cache"

      - name: Verify bundled engine with an isolated PATH
        shell: pwsh
        run: |
          # Hide Git/MSYS DLLs on the runner so missing bundled DLLs fail here.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:TESSDATA_PREFIX -ErrorAction SilentlyContinue
          $exe = Resolve-Path "$env:RUNTIME_DIR\bin\tesseract.exe"
          $data = Resolve-Path "$env:RUNTIME_DIR\tessdata"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "tesseract --version failed ($LASTEXITCODE)" }
          $langs = & $exe --tessdata-dir $data --list-langs
          $langs
          foreach ($code in "eng", "lav", "rus") {
            if (-not ($langs -contains $code)) { throw "Missing bundled language $code" }
          }

      - name: Real OCR regression tests against the bundled engine
        shell: pwsh
        env:
          SRA_REQUIRE_REAL_OCR: "1"
          TESSERACT_CMD: ""
        run: |
          $python = (Get-Command python).Source
          $env:SRA_OCR_RUNTIME_DIR = (Resolve-Path $env:RUNTIME_DIR).Path
          $env:PATH = "$(Split-Path $python);$env:SystemRoot\System32;$env:SystemRoot"
          & $python -m unittest discover -s tests -p "test_real_tesseract_ocr.py" -v
          if ($LASTEXITCODE -ne 0) { throw "real OCR tests failed" }
          & $python -m unittest discover -s tests -p "test_ocr_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "OCR unit tests failed" }
          & $python -m unittest discover -s tests -p "test_matrix_reconstruction.py" -v
          if ($LASTEXITCODE -ne 0) { throw "matrix tests failed" }
          & $python -m unittest discover -s tests -p "test_spatial_review_ui.py" -v
          if ($LASTEXITCODE -ne 0) { throw "spatial UI tests failed" }
          & $python -m unittest discover -s tests -p "test_true_false_import.py" -v
          if ($LASTEXITCODE -ne 0) { throw "True/False import tests failed" }
          & $python -m unittest discover -s tests -p "test_shared_scales.py" -v
          if ($LASTEXITCODE -ne 0) { throw "shared scale tests failed" }
          & $python -m unittest discover -s tests -p "test_app_startup.py" -v
          if ($LASTEXITCODE -ne 0) { throw "startup tests failed" }
          & $python -m unittest discover -s tests -p "test_analysis_runs.py" -v
          if ($LASTEXITCODE -ne 0) { throw "classic parity tests failed" }
          & $python -m unittest discover -s tests -p "test_workspace_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Stage 33 workspace tests failed" }
          & $python -m unittest discover -s tests -p "test_distribution_tools.py" -v
          if ($LASTEXITCODE -ne 0) { throw "distribution tool tests failed" }

      - name: Analysis self-test from source (reference report hashes)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          python analysis_selftest.py diagnostics/source-analysis-selftest.json
          if ($LASTEXITCODE -ne 0) {
            Get-Content diagnostics/source-analysis-selftest.json
            throw "analysis self-test from source failed"
          }

      - name: Build unsigned Windows desktop bundle
        run: >-
          flet build windows .
          --module-name app
          --python-version 3.12
          --product "Statistical Research Assistant"
          --artifact "StatisticalResearchAssistant"
          --no-rich-output --yes

      - name: Validate executable and packaged OCR runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build/windows" -Filter "StatisticalResearchAssistant.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Expected .exe was not created" }
          Write-Output "Executable: $($exe.FullName)"
          "EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem -Path "build/windows" -Recurse -Include "*.zip" | ForEach-Object { "$($_.FullName) $($_.Length)" }
          python tools/check_packaged_ocr.py build/windows

      - name: Run OCR self-test inside the packaged application
        shell: pwsh
        timeout-minutes: 15
        run: |
          $result = Join-Path $env:RUNNER_TEMP "packaged-ocr-selftest.json"
          if (Test-Path $result) { Remove-Item $result }
          $env:SRA_OCR_SELFTEST = $result
          Remove-Item Env:TESSERACT_CMD -ErrorAction SilentlyContinue
          Remove-Item Env:TESSDATA_PREFIX -ErrorAction SilentlyContinue
          # No Python, Tesseract or MSYS directories on PATH: a clean machine.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          $process = Start-Process -FilePath $env:EXE_PATH -PassThru
          $deadline = (Get-Date).AddMinutes(10)
          while (-not (Test-Path $result) -and (Get-Date) -lt $deadline -and -not $process.HasExited) {
            Start-Sleep -Seconds 3
          }
          Start-Sleep -Seconds 2
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          if (-not (Test-Path $result)) { throw "Packaged app wrote no OCR self-test result (exit: $($process.ExitCode))" }
          Get-Content $result
          $json = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $json.ok) { throw "Packaged OCR self-test failed: $($json.errors -join '; ')" }
          if ($json.origin -ne "bundled") { throw "Packaged app did not use the bundled engine: $($json.origin)" }
          Copy-Item $result diagnostics/packaged-ocr-selftest.json

      - name: Normal GUI startup (no Python/Tesseract on PATH, screenshots)
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Ordinary launch path, not the OCR self-test: fails on a failed or
          # missing Home screen, a black window > 3 s or a dark final frame.
          python tools/check_gui_startup.py "$env:EXE_PATH" gui-startup
          if ($LASTEXITCODE -ne 0) { throw "Packaged GUI startup check failed" }

      - name: Stage 33 workspace preview GUI startup (SRA_UI=workspace)
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Same packaged exe, opened straight into the new workspace preview.
          python tools/check_gui_startup.py "$env:EXE_PATH" gui-workspace --workspace
          if ($LASTEXITCODE -ne 0) { throw "Packaged workspace preview startup check failed" }

      - name: Run analysis self-test inside the packaged application
        shell: pwsh
        timeout-minutes: 15
        run: |
          # Every statistical procedure, chart, Word/XLSX export and the survey
          # database, in the packaged (cleaned) app; the report hashes must equal
          # the source checkout's, i.e. the cleanup changed no reported number.
          $python = (Get-Command python).Source
          $result = Join-Path $env:RUNNER_TEMP "packaged-analysis-selftest.json"
          if (Test-Path $result) { Remove-Item $result }
          $env:SRA_ANALYSIS_SELFTEST = $result
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          $process = Start-Process -FilePath $env:EXE_PATH -PassThru
          $deadline = (Get-Date).AddMinutes(10)
          while (-not (Test-Path $result) -and (Get-Date) -lt $deadline -and -not $process.HasExited) {
            Start-Sleep -Seconds 3
          }
          Start-Sleep -Seconds 2
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          if (-not (Test-Path $result)) { throw "Packaged app wrote no analysis self-test result (exit: $($process.ExitCode))" }
          Copy-Item $result diagnostics/packaged-analysis-selftest.json
          $json = Get-Content $result -Raw | ConvertFrom-Json
          "Packaged analysis self-test: ok=$($json.ok), import $($json.import_seconds) s, total $($json.seconds) s"
          if (-not $json.ok) { throw "Packaged analysis self-test failed: $($json.errors -join '; ')" }
          & $python analysis_selftest.py --compare diagnostics/source-analysis-selftest.json diagnostics/packaged-analysis-selftest.json
          if ($LASTEXITCODE -ne 0) { throw "Packaged reports differ from the source checkout" }

      - name: Measure package composition and size budget
        shell: pwsh
        run: |
          # Level 9 = the compression of the uploaded artifact below.
          $source = Split-Path $env:EXE_PATH
          python tools/package_audit.py $source --level 9 --title "Windows package composition (${{ github.sha }})" `
            --json diagnostics/package-size.json --markdown diagnostics/package-size.md `
            --budget-installed-mib 400 --budget-zip-mib 160 | Out-Null
          $code = $LASTEXITCODE
          Get-Content diagnostics/package-size.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -ne 0) { throw "Package size budget exceeded (see the job summary)" }

      # The application folder itself is the artifact: one ZIP to download and
      # extract, no ZIP inside a ZIP (issue #23). Diagnostics travel separately.
      - name: Upload unsigned portable preview (application folder)
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: StatisticalResearchAssistant-Windows-x64-unsigned-preview
          path: build/windows/
          compression-level: 9
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics (self-tests, size report, screenshots)
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            diagnostics/
            gui-startup/
            gui-workspace/
          if-no-files-found: error
          retention-days: 14
      - name: Report download size and checksum
        shell: pwsh
        run: |
          $lines = @(
            "",
            "### Download",
            "- Artifact: ${{ steps.upload-app.outputs.artifact-url }}",
            "- SHA-256 of the downloaded ZIP: ``${{ steps.upload-app.outputs.artifact-digest }}``"
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $lines
