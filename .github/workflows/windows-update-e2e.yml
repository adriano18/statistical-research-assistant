name: Windows in-app update A -> B (installed program)

# Stage 35 (#45), the acceptance test: a researcher installs version A,
# creates a project, is told about version B inside the application, reads
# what is new, updates with one click (after an interrupted download), and
# the program starts again as B with the project intact. Before that the
# installed program must refuse update information signed with another key,
# never offer an older version, and delete a damaged download without
# starting it. Code-signature decisions are checked with a throwaway
# certificate. A and B are test builds: their update key is generated here
# and thrown away, and they accept this runner's local update server only.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.py"
      - "app_identity.py"
      - "app_paths.py"
      - "update_*.py"
      - "project_store.py"
      - "workspace_shell.py"
      - "requirements.txt"
      - "packaging/**"
      - "tools/build_installer.py"
      - "tools/write_build_info.py"
      - "tools/update_signing.py"
      - "tools/update_test_server.py"
      - "tools/prepare_update_scenarios.py"
      - "tools/check_code_signature.py"
      - "tools/check_installed_app.py"
      - "tools/windows_gui_e2e.py"
      - ".github/workflows/windows-update-e2e.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 170
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      RUNTIME_DIR: bundled_ocr\windows-x64
      VERSION_A: 1.0.0-test.${{ github.run_number }}
      VERSION_B: 1.0.1-test.${{ github.run_number }}
      ENDPOINT: http://127.0.0.1:8765/sra-update-test.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and the UI Automation driver
        run: python -m pip install -r requirements.txt "zstandard>=0.23,<1" "pywinauto==0.6.9"
      - name: Cache pinned OCR packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\ocr-cache
          key: ocr-msys2-${{ hashFiles('packaging/windows_ocr_runtime.lock.json') }}
      - name: Prepare pinned Tesseract runtime (SHA-256 verified)
        run: python tools/prepare_windows_ocr_runtime.py fetch --out "${{ env.RUNTIME_DIR }}" --cache "${{ runner.temp }}\ocr-cache"
      - name: Use a 1920x1080 desktop
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Throwaway update-signing key (test builds only)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          $key = Join-Path $env:RUNNER_TEMP "test-update.key"
          $out = python tools/update_signing.py new-key --private-out $key | ConvertFrom-Json
          "TEST_KEY_FILE=$key" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_PUBLIC_KEY=$($out.public_key)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Test key id: $($out.key_id)"
      - name: Version identity of build A
        run: python tools/write_build_info.py --channel test --version "${{ env.VERSION_A }}" --build "${{ github.run_number }}" --commit "${{ github.sha }}" --update-key "${{ env.TEST_PUBLIC_KEY }}" --test-endpoint "${{ env.ENDPOINT }}"
      - name: Build the Windows application
        run: >-
          flet build windows .
          --module-name app
          --python-version 3.12
          --product "Statistical Research Assistant"
          --artifact "StatisticalResearchAssistant"
          --build-version 1.0.0
          --build-number ${{ github.run_number }}
          --no-rich-output --yes
      - name: Locate the bundle
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          $exe = Get-ChildItem -Path build/windows -Filter StatisticalResearchAssistant.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Expected .exe was not created" }
          "BUNDLE=$(Split-Path $exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Inno Setup when the runner has none
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $iscc -and -not (Get-Command ISCC -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup could not be installed" }
          }
      - name: Installers A and B (B differs in version only)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          python tools/build_installer.py $env:BUNDLE --out dist-a --compression lzma2/fast
          if ($LASTEXITCODE -ne 0) { throw "installer A failed" }
          Copy-Item -Recurse -Path $env:BUNDLE -Destination build\windows-b
          python tools/write_build_info.py --channel test --version "$env:VERSION_B" --build "${{ github.run_number }}" --commit "${{ github.sha }}" --update-key "$env:TEST_PUBLIC_KEY" --test-endpoint "$env:ENDPOINT" --out build\windows-b\app\build_info.json
          python tools/build_installer.py build\windows-b --out dist-b --compression lzma2/fast
          if ($LASTEXITCODE -ne 0) { throw "installer B failed" }
      - name: Update information for the local update server
        run: python tools/prepare_update_scenarios.py --installer "dist-b\StatisticalResearchAssistant-${{ env.VERSION_B }}-Setup.exe" --version "${{ env.VERSION_B }}" --key-file "${{ env.TEST_KEY_FILE }}" --out served

      - name: Install version A (silent, per user)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          python tools/check_installed_app.py install "dist-a\StatisticalResearchAssistant-${{ env.VERSION_A }}-Setup.exe" --log evidence\install-a.log
          python tools/check_installed_app.py verify --version "${{ env.VERSION_A }}" --json evidence\verify-a.json
      - name: "Installed A: create a project, refuse bad updates, update to B"
        shell: pwsh
        timeout-minutes: 60
        env:
          SRA_E2E_UPDATE_ROOT: ${{ github.workspace }}\served
          SRA_E2E_UPDATE_FROM: ${{ env.VERSION_A }}
          SRA_E2E_UPDATE_TO: ${{ env.VERSION_B }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          python tools/windows_gui_e2e.py "$env:LOCALAPPDATA\Programs\Statistical Research Assistant\StatisticalResearchAssistant.exe" evidence\journeys --real-data --only installed-data update-refusals update-a-to-b
          if ($LASTEXITCODE -ne 0) { throw "update journeys failed" }
      - name: B is installed in place of A, once, with the project intact
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          python tools/check_installed_app.py verify --version "${{ env.VERSION_B }}" --json evidence\verify-b.json
          python tools/check_installed_app.py data evidence\data-after-update.json --expect "Installed study (fictional)"
      - name: Update record and installer log
        if: always()
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          $updates = "$env:LOCALAPPDATA\StatisticalResearchAssistant\updates"
          if (Test-Path $updates) { Copy-Item -Recurse $updates evidence\updates -ErrorAction SilentlyContinue }
          if (Test-Path "$updates\history.json") { Get-Content "$updates\history.json" }
      - name: Code-signature decisions with a throwaway certificate
        run: python tools/check_code_signature.py "dist-b\StatisticalResearchAssistant-${{ env.VERSION_B }}-Setup.exe" evidence\code-signature.json
      - name: Uninstall keeps the research data
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          python tools/check_installed_app.py uninstall --log evidence\uninstall.log
          python tools/check_installed_app.py removed --json evidence\removed.json
          python tools/check_installed_app.py data --expect "Installed study (fictional)"
      - name: Upload evidence (screenshots, recordings, logs, results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-e2e
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
