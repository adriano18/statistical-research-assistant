name: Windows native display scale 100/125/150 % (packaged program)

# Stage 35 (#46): the packaged program at real Windows display scales, set
# the way Settings -> Display -> Scale sets them. This is not browser zoom:
# the screenshots of the browser checks at device scale 1.25/1.5 remain a
# separate, weaker check. Measures the DPI Windows gives the window and
# checks Home, the sidebar and right-edge clipping at every scale.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "workspace_*.py"
      - "app.py"
      - "tools/set_display_scale.py"
      - "tools/check_native_dpi.py"
      - ".github/workflows/windows-native-dpi.yml"

permissions:
  contents: read

jobs:
  native-dpi:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      RUNTIME_DIR: bundled_ocr\windows-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and the UI Automation driver
        run: python -m pip install -r requirements.txt "zstandard>=0.23,<1" "pywinauto==0.6.9"
      - name: Cache pinned OCR packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\ocr-cache
          key: ocr-msys2-${{ hashFiles('packaging/windows_ocr_runtime.lock.json') }}
      - name: Prepare pinned Tesseract runtime (SHA-256 verified)
        run: python tools/prepare_windows_ocr_runtime.py fetch --out "${{ env.RUNTIME_DIR }}" --cache "${{ runner.temp }}\ocr-cache"
      - name: Use a 1920x1080 desktop
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: What scales this display offers
        run: python tools/set_display_scale.py --get
      - name: Build the Windows application
        run: >-
          flet build windows .
          --module-name app
          --python-version 3.12
          --product "Statistical Research Assistant"
          --artifact "StatisticalResearchAssistant"
          --no-rich-output --yes
      - name: The program at 100, 125 and 150 %
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step
          $exe = Get-ChildItem -Path build/windows -Filter StatisticalResearchAssistant.exe -Recurse | Select-Object -First 1
          python tools/check_native_dpi.py $exe.FullName native-dpi
      - name: Upload screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-dpi
          path: native-dpi/
          if-no-files-found: warn
          retention-days: 14
